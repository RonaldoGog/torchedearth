# Runs the bot every morning and publishes the site to GitHub Pages.
# On Sundays it also builds the weekly newsletter.
# Manual runs: Actions tab -> "Update site" -> Run workflow. Tick "Rebuild the
# pages only" to republish from the stories already saved (about a minute) —
# no fetching, classifying or posting. Use it after changing a template, the
# stylesheet or overrides.yml.
name: Update site

on:
  schedule:
    - cron: "15 13 * * *"   # daily, 13:15 UTC = 6:15 am Pacific (5:15 during standard time)
    - cron: "0 15 * * 0"    # Sunday newsletter, 15:00 UTC
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "Rebuild the pages only (no fetching, classifying or posting)"
        type: boolean
        default: false
      newsletter:
        description: "Also build the weekly newsletter"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch and classify today's headlines
        if: inputs.rebuild_only != true
        run: python bot/pipeline.py
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Weekly newsletter
        if: github.event.schedule == '0 15 * * 0' || inputs.newsletter == true
        run: python bot/newsletter.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_SEND: ${{ vars.NEWSLETTER_SEND }}

      - name: Build the site
        run: python bot/build.py

      - name: Post to social accounts
        if: inputs.rebuild_only != true
        run: python bot/social.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}

      - name: Save the database back to the repository
        # A run can take a while; if a change was pushed by hand in the meantime,
        # put today's data on top of it instead of failing the push.
        run: |
          git config user.name "torchedearth-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "Daily update $(date -u +%F)" || echo "nothing new"
          git pull --rebase origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
