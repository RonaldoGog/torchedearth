# Repairs the stories that still link through news.google.com instead of to the
# publisher, a batch at a time, several times a day.
#
# Why a separate workflow: Google rate-limits these lookups by IP. A runner that
# has just asked 900 times in a row gets refused — which is what happens in the
# morning run — while seven small batches from seven fresh runners get through.
#
# It only writes data/. The site is rebuilt by the next daily run, so a link
# repaired at 08:40 shows up on the site the following morning.
#
# Manual run: Actions tab -> "Repair Google links" -> Run workflow. Leave the box
# empty for the normal batch size, or type a number for a smaller one.
name: Repair Google links

on:
  schedule:
    # Every three hours, kept clear of the 13:15 UTC daily run and the 15:00 Sunday
    # newsletter. Seven batches of 150 a day, against the ~440 the morning run manages.
    - cron: "40 2,5,8,11,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many links to try (blank = fetch.repair_per_run in settings.yml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  # Shares the daily run's group on purpose: the two must never write data/ at once.
  group: update-site
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unwrap a batch of Google links
        run: python bot/repair_links.py ${{ inputs.batch }}

      - name: Save the database back to the repository
        run: |
          git config user.name "torchedearth-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/items.json data/url_cache.json
          git commit -m "Repair Google links $(date -u +'%F %H:%M')" || echo "nothing repaired"
          git pull --rebase origin main
          git push
