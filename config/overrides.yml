# Manual controls. Edit on GitHub (pencil icon), commit, and the site rebuilds
# on the next run — or start a run by hand from the Actions tab.
#
# Paste the story's URL exactly as it appears on the site.

lead: ""          # pin one story as the lead, e.g. https://example.com/story

feature: []       # force stories onto the front page regardless of score or age
  # - https://example.com/story

hide: []          # remove stories from every page (wrong, off-topic, offensive)
  # - https://example.com/story

section: {}       # move a story to a different section when the bot gets it wrong
  # causes:
  #   - https://example.com/story
  # effects: []
  # solutions: []
  # other: []
  #
  # Standing rules the bot already follows, so you shouldn't need this often:
  #   every opinion piece — op-ed, editorial, column, letter, commentary — goes
  #   to Elsewhere whatever its subject, and climate disinformation, denial,
  #   fossil-fuel PR and the suppression of climate science go to Causes.
  #
  # A story that still links through news.google.com gets its real publisher
  # link later; if that happens, re-paste the new URL from the site.
