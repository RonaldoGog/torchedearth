# Sources the bot reads every morning.
#   name     shown on the site
#   id       short slug, stable
#   domain   used to recognise the same outlet when a story arrives via Google News
#   rss      the feed URL (omit for outlets that killed RSS; add them to queries.yml instead)
#   paywall  true if readers usually hit a subscription wall
#   weight   1-10, how much to trust/rank this outlet; also decides which outlet
#            represents a story that many outlets covered
#   note     one line for the Sources page
#   verify   true = feed URL not yet confirmed; the first run reports dead feeds in data/feed_status.json
#
# Adding a source is one entry here. Removing one is deleting the entry.

feeds:
  # ---- Climate specialists (free) ----
  - {name: Inside Climate News, id: icn, domain: insideclimatenews.org, rss: https://insideclimatenews.org/feed/, paywall: false, weight: 9, note: Pulitzer-winning nonprofit climate newsroom.}
  - {name: Carbon Brief, id: carbonbrief, domain: carbonbrief.org, rss: https://www.carbonbrief.org/feed/, paywall: false, weight: 9, note: UK site covering climate science and policy in depth.}
  - {name: Grist, id: grist, domain: grist.org, rss: https://grist.org/feed/, paywall: false, weight: 8, note: Nonprofit climate and justice coverage.}
  - {name: Yale Climate Connections, id: ycc, domain: yaleclimateconnections.org, rss: https://yaleclimateconnections.org/feed/, paywall: false, weight: 7, note: Explainers and weather-climate reporting.}
  - {name: Climate Home News, id: climatehome, domain: climatechangenews.com, rss: https://www.climatechangenews.com/feed/, paywall: false, weight: 7, note: International climate politics and diplomacy.}
  - {name: Mongabay, id: mongabay, domain: news.mongabay.com, rss: https://news.mongabay.com/feed/, paywall: false, weight: 7, note: Forests, oceans and biodiversity.}
  - {name: Wildfire Today, id: wildfiretoday, domain: wildfiretoday.com, rss: https://wildfiretoday.com/feed/, paywall: false, weight: 4, note: Wildfire news; only climate-linked stories pass the filter.}

  # ---- General news with climate desks ----
  - {name: The Guardian, id: guardian, domain: theguardian.com, rss: https://www.theguardian.com/environment/climate-crisis/rss, paywall: false, weight: 8, note: Climate crisis section.}
  - {name: The New York Times, id: nyt, domain: nytimes.com, rss: https://rss.nytimes.com/services/xml/rss/nyt/Climate.xml, paywall: true, weight: 8, note: Climate section.}
  - {name: NPR, id: npr, domain: npr.org, rss: https://feeds.npr.org/1167/rss.xml, paywall: false, weight: 8, note: Climate coverage., verify: true}
  - {name: BBC, id: bbc, domain: bbc.com, rss: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml, paywall: false, weight: 7, note: Science and environment.}
  - {name: The Conversation, id: conversation, domain: theconversation.com, rss: https://theconversation.com/us/environment/articles.atom, paywall: false, weight: 7, note: Researchers writing for the public., verify: true}

  # ---- Science ----
  - {name: Phys.org, id: physorg, domain: phys.org, rss: https://phys.org/rss-feed/earth-news/, paywall: false, weight: 6, note: Earth science research news, mostly from university press offices.}
  - {name: ScienceDaily, id: sciencedaily, domain: sciencedaily.com, rss: https://www.sciencedaily.com/rss/earth_climate/climate.xml, paywall: false, weight: 6, note: Research summaries.}
  - {name: Nature Climate Change, id: nclimate, domain: nature.com, rss: https://www.nature.com/nclimate.rss, paywall: true, weight: 8, note: Peer-reviewed journal; abstracts are free.}
  - {name: Eos, id: eos, domain: eos.org, rss: https://eos.org/feed, paywall: false, weight: 7, note: American Geophysical Union news magazine.}
  - {name: New Scientist, id: newscientist, domain: newscientist.com, rss: https://www.newscientist.com/subject/environment/feed/, paywall: true, weight: 6, note: Environment section., verify: true}

  # ---- Energy transition ----
  - {name: CleanTechnica, id: cleantechnica, domain: cleantechnica.com, rss: https://cleantechnica.com/feed/, paywall: false, weight: 5, note: Clean-energy industry news and opinion.}
  - {name: Electrek, id: electrek, domain: electrek.co, rss: https://electrek.co/feed/, paywall: false, weight: 5, note: EVs and solar.}

  # ---- Feeds added 9 Sep 2026, replacing their Google News searches ----
  # An outlet moved here stops arriving through news.google.com, so its stories keep a
  # direct link and get the right name, paywall flag and weight from the moment they land.
  # Its entry in queries.yml was removed at the same time.
  - {name: Canary Media, id: canary, domain: canarymedia.com, rss: https://www.canarymedia.com/rss, paywall: false, weight: 7, note: Clean-energy journalism.}
  - {name: Heatmap, id: heatmap, domain: heatmap.news, rss: https://heatmap.news/feeds/feed.rss, paywall: true, weight: 7, note: Energy transition and climate policy.}
  - {name: CBS News, id: cbs, domain: cbsnews.com, rss: https://www.cbsnews.com/latest/rss/climate, paywall: false, weight: 6, note: Climate desk. (The sibling /environment feed exists but is always empty - do not switch to it.)}
  - {name: NBC News, id: nbc, domain: nbcnews.com, rss: https://feeds.nbcnews.com/nbcnews/public/science, paywall: false, weight: 6, note: Science desk; NBC publishes no climate-only feed.}
  - {name: PBS NewsHour, id: pbs, domain: pbs.org, rss: https://www.pbs.org/newshour/feeds/rss/science, paywall: false, weight: 7, note: Science segments, heavy on climate.}
  - {name: ProPublica, id: propublica, domain: propublica.org, rss: https://www.propublica.org/feeds/propublica/main, paywall: false, weight: 8, note: Investigative nonprofit; main feed, low enough volume that the climate filter does the sorting.}
  - {name: The Texas Tribune, id: texastribune, domain: texastribune.org, rss: https://www.texastribune.org/topics/environment/feed/, paywall: false, weight: 6, note: Nonprofit; Texas environment and energy.}
  - {name: Copernicus Climate Change Service, id: copernicus, domain: climate.copernicus.eu, rss: https://climate.copernicus.eu/rss.xml, paywall: false, weight: 9, note: EU climate data agency. Roughly monthly; the search it replaces was returning nothing at all.}

  # ---- Feed *and* a Google News search ----
  # These feeds work but are general, thin or off-news, so the queries.yml search stays
  # as well. Stories may briefly appear twice until a Google link is unwrapped.
  - {name: The Washington Post, id: wapo, domain: washingtonpost.com, rss: https://feeds.washingtonpost.com/rss/national/energy-environment, paywall: true, weight: 8, note: Climate and environment desk. Feed is the legacy energy-environment slug and carries very few items., verify: true}
  - {name: The Atlantic, id: atlantic, domain: theatlantic.com, rss: https://www.theatlantic.com/feed/channel/science/, paywall: true, weight: 7, note: Science channel, full article text. (The /planet channel feed exists but is always empty.), verify: true}
  - {name: The Boston Globe, id: bostonglobe, domain: bostonglobe.com, rss: "https://www.bostonglobe.com/arc/outboundfeeds/rss/?outputType=xml", paywall: true, weight: 6, note: Undocumented general feed; the Globe publishes no working section feeds., verify: true}
  - {name: Fox News, id: foxnews, domain: foxnews.com, rss: https://moxie.foxnews.com/google-publisher/latest.xml, paywall: false, weight: 4, note: Included to keep the sceptical side of the coverage in view. General feed only - the Fox science feed stopped updating in August 2026.}
  - {name: NOAA, id: noaa, domain: noaa.gov, rss: https://www.noaa.gov/rss.xml, paywall: false, weight: 9, note: US climate and ocean data. Agency-wide feed, only part of it is climate.}
  - {name: NASA, id: nasa, domain: nasa.gov, rss: https://www.nasa.gov/earth/feed/, paywall: false, weight: 9, note: Earth science; low volume, so the Google News search stays too. The science.nasa.gov Earth Observatory feed reads fine from a browser but its CDN refused the GitHub runner (HTTPError, 9 Sep 2026)., verify: true}

  # ---- No usable feed: found through Google News searches in queries.yml ----
  # These entries carry the name/paywall/weight so their stories are labelled correctly.
  # Checked 9 Sep 2026 - none of these has a feed worth wiring up.
  - {name: Associated Press, id: ap, domain: apnews.com, paywall: false, weight: 9, note: Wire service; the original behind many reprints.}
  - {name: Reuters, id: reuters, domain: reuters.com, paywall: false, weight: 9, note: Wire service; RSS feeds discontinued, found via search.}
  - {name: CNN, id: cnn, domain: cnn.com, paywall: false, weight: 7, note: Climate section. Its RSS feeds still parse but stopped updating in 2023.}
  - {name: Bloomberg, id: bloomberg, domain: bloomberg.com, paywall: true, weight: 8, note: Bloomberg Green. The Green feed is dead; only general Bloomberg feeds respond.}
  - {name: Axios, id: axios, domain: axios.com, paywall: false, weight: 6, note: Short-form energy and climate items. A climate feed may exist at api.axios.com but could not be reached to confirm.}
  - {name: Ember, id: ember, domain: ember-energy.org, paywall: false, weight: 8, note: Energy think tank; electricity data. Its feed is valid RSS containing no items - the content sits outside WordPress feeds.}
  - {name: International Energy Agency, id: iea, domain: iea.org, paywall: false, weight: 8, note: Energy data and reports. Publishes no feed at all; email newsletters only.}
  - {name: DeSmog, id: desmog, domain: desmog.com, paywall: false, weight: 6, note: Investigations into climate misinformation and lobbying. Its feed sits behind a bot-blocking challenge, so stories are found through search.}
